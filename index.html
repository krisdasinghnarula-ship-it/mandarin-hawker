<!DOCTYPE html>
<html>

<head>
    <title>Singapore Drink Order Generator</title>
</head>

<body>

    <h1>🇸🇬 Singapore Hawker Drink Order Generator</h1>

    <h2>What do you want?</h2>

<button onclick="chooseDrink('Kopi')">Coffee</button>
<button onclick="chooseDrink('Teh')">Tea</button>
    <p id="result"></p>
<p id="milk-question"></p>

<button onclick="chooseMilk('condensed')">Condensed milk</button>
<button onclick="chooseMilk('evaporated')">Evaporated milk</button>
<button onclick="chooseMilk('none')">No milk</button>

<p id="sugar-question"></p>
    <button onclick="chooseSugar(true)">Yes, sugar</button>
<button onclick="chooseSugar(false)">No sugar</button>
<script>
let drink = "";
let milk = "";
let sugar = false;
function chooseDrink(selectedDrink) {
    drink = selectedDrink;

    document.getElementById("result").textContent = "You chose " + drink;
    document.getElementById("milk-question").textContent = "Do you want milk?";
}

function chooseMilk(selectedMilk) {
    milk = selectedMilk;

    document.getElementById("milk-question").textContent =
        "Milk: " + milk;

    document.getElementById("sugar-question").textContent =
        "Do you want sugar?";
}
function chooseSugar(hasSugar) {
    sugar = hasSugar;
    generateOrder();
}
    function generateOrder() {
    let order = "";

    if (milk === "condensed" && sugar === true) {
        order = drink;
    } else if (milk === "condensed" && sugar === false) {
        order = drink + " kosong";
    } else if (milk === "evaporated" && sugar === true) {
        order = drink + " C";
    } else if (milk === "evaporated" && sugar === false) {
        order = drink + " C kosong";
    } else if (milk === "none" && sugar === true) {
        order = drink + " O";
    } else if (milk === "none" && sugar === false) {
        order = drink + " O kosong";
    }

    document.getElementById("result").textContent =
        "🇸🇬 Your order: " + order;
}

</script>
</body>

</html>
