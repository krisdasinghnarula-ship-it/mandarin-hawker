<!DOCTYPE html>
<html>

<head>
    <title>Singapore Drink Order Generator</title>
</head>

<body>

    <h1>🇸🇬 Singapore Hawker Drink Order Generator</h1>

    <h2>What do you want?</h2>

<button onclick="chooseDrink('Kopi')">Coffee</button>
<button onclick="chooseDrink('Teh')">Tea</button>
    <p id="result"></p>
    <p id="milk-question"></p>
    <button onclick="chooseMilk(true)">Yes, with milk</button>
<button onclick="chooseMilk(false)">No milk</button>
<script>

function chooseDrink(drink) {
    document.getElementById("result").textContent = "You chose " + drink;
    document.getElementById("milk-question").textContent = "Do you want milk?";
}

</script>
</body>

</html>
